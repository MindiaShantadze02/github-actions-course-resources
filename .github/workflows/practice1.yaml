name: Practice 1 problem
on:
  push:
    branches: [ main, feature/* ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/02 Basics/04 Practice Project (Start)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          npm ci
          npm run lint
          npm run test
          npm run build
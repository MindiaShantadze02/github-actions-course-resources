name: Deploy Project
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Output GitHub Context
        run: echo "${{ toJSON(github) }}"
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/02 Basics/02 Starting Project
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/02 Basics/02 Starting Project
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo "Deploying the application"
